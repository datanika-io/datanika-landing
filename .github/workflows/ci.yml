name: CI

on:
  pull_request:
    branches: [dev, main]

  # `build` is the ONLY required status check on `dev`, so a merge queue on that
  # branch is entirely dependent on this trigger existing. Without it GitHub never
  # starts a run for a queue entry, the required check is never reported, and the
  # entry sits until `check_response_timeout_minutes` expires and is ejected — a
  # PR that stops progressing for no visible reason. That is strictly worse than
  # the `strict`-mode livelock this queue exists to remove, which a human clears
  # in seconds. Deliberately unfiltered by branch: this repo only ever queues on
  # `dev`, and a wrong filter here fails in exactly the silent direction above.
  # Guarded by tests/merge-queue-triggers.test.ts. (core#904)
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # ⚠️ NOT a bare `true`. A cancelled run is an ABSENT verdict, and the two events
  # here pay wildly different prices for one:
  #   pull_request — a superseded run computes an answer you are about to recompute
  #                  on the new head. Cancelling is free, so cancel.
  #   merge_group  — nothing recomputes it. The queue waits out its check-response
  #                  timeout and ejects the entry. Runner minutes are cheaper than
  #                  a merge that silently did not happen, so never cancel.
  # `github.ref` is already unique per queue entry (`refs/heads/gh-readonly-queue/
  # dev/pr-N-<sha>`), so this is belt and braces — but the failure it guards against
  # is invisible, and the expression costs nothing. (core#904)
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # The deploy's publish step is bash on the Aweb box, so vitest cannot
      # reach it — and it is the one step that can break the *live* web root
      # (landing#301). Gated here rather than left to a deploy-time discovery:
      # this harness went red against the first draft of the script and caught
      # a live-site destroyer. Runs on ubuntu only; nothing to install.
      - name: Deploy publish-script tests
        run: bash scripts/test-publish-web-root.sh

      # The publish-detection mechanism behind IndexNow submission and the
      # "this went live" notification (landing#340 / #339 / #336). Gated here
      # for the same reason as the publish script: it is bash driven from a
      # workflow, so vitest cannot reach it — and landing#339 proved that a
      # defect in exactly this code can stay green for four and a half months
      # because every other available signal is green while it does nothing.
      - name: Publish-detection tests
        run: bash scripts/test-site-urls.sh

      # landing#354. The step above tests the mapping against a SYNTHETIC build
      # written from the same belief as the mapping itself, so the two can agree
      # with each other and with nothing else — which is exactly what happened.
      # This one tests it against the REAL `dist/` produced by the Build step
      # above, asking which built page carries each source's own title. It must
      # therefore run AFTER Build, and it hard-fails if `dist/` is absent rather
      # than skipping: a harness that quietly does nothing is the failure mode
      # being defended against.
      - name: URL correspondence tests
        run: bash scripts/test-url-correspondence.sh
